<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="deepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura / Glow -->
  <circle cx="120" cy="120" r="110" fill="url(#glow)"/>

  <!-- Outer Ring (11e Heure / Horloge Céleste) -->
  <circle cx="120" cy="120" r="95" fill="#ffffff" stroke="url(#skyGrad)" stroke-width="4" filter="url(#softShadow)"/>
  <circle cx="120" cy="120" r="84" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Clock tick marks - Special highlight on the 11th hour mark -->
  <!-- 12 o'clock -->
  <line x1="120" y1="32" x2="120" y2="40" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <!-- 1 o'clock -->
  <line x1="164" y1="44" x2="160" y2="51" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- 2 o'clock -->
  <line x1="196" y1="76" x2="189" y2="80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- 3 o'clock -->
  <line x1="208" y1="120" x2="200" y2="120" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <!-- 6 o'clock -->
  <line x1="120" y1="208" x2="120" y2="200" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <!-- 9 o'clock -->
  <line x1="32" y1="120" x2="40" y2="120" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <!-- 10 o'clock -->
  <line x1="44" y1="76" x2="51" y2="80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- 11 o'clock: Highlighted with Gold & Rays! -->
  <circle cx="76" cy="44" r="8" fill="url(#goldGrad)" filter="url(#softShadow)"/>
  <line x1="76" y1="44" x2="120" y2="120" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Divine Rays radiating from Center -->
  <path d="M120 70 L123 100 L120 120 L117 100 Z" fill="#38bdf8" opacity="0.4"/>
  <path d="M75 100 L105 115 L120 120 L100 125 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M165 100 L140 125 L120 120 L135 115 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Holy Cross Symbol -->
  <g id="cross">
    <!-- Vertical beam -->
    <rect x="113" y="58" width="14" height="102" rx="4" fill="url(#deepGrad)"/>
    <!-- Horizontal beam -->
    <rect x="86" y="82" width="68" height="14" rx="4" fill="url(#deepGrad)"/>
    <!-- Golden Core Accent -->
    <circle cx="120" cy="89" r="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Holy Spirit Dove (L'Esprit de restauration) -->
  <g transform="translate(120, 168) scale(0.65)" id="dove">
    <!-- Dove Wings & Body -->
    <path d="M0 -30 C-18 -48 -45 -40 -60 -20 C-40 -12 -25 -5 -15 0 C-30 20 -40 40 -15 35 C-5 32 0 25 0 25 C0 25 5 32 15 35 C40 40 30 20 15 0 C25 -5 40 -12 60 -20 C45 -40 18 -48 0 -30 Z" 
          fill="url(#skyGrad)" filter="url(#softShadow)"/>
    <!-- Head and beak pointing upwards -->
    <circle cx="0" cy="-33" r="5" fill="#0284c7"/>
    <path d="M0 -37 L-2 -43 L2 -43 Z" fill="#eab308"/>
  </g>

  <!-- Roman Numeral XI Badge at top -->
  <rect x="104" y="24" width="32" height="16" rx="4" fill="#0369a1"/>
  <text x="120" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">XI</text>
</svg>
